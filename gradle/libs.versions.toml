[versions] #######################################################################################
# Toolchain — kept in lock-step with KitePDF so the two libraries build with the same stack.
kotlin = "2.4.0"
agp = "9.2.1"
vanniktechPublish = "0.36.0"
dokka = "2.0.0"

# Tier 2 (:kitetorrent-session) only. The :kitetorrent core stays kotlin-stdlib-only.
coroutines = "1.11.0"
ktor = "3.5.0"
kotlinxIo = "0.9.0"

[libraries] ######################################################################################
# Tier 2 networking stack — coroutines replace Asio's event loop, ktor-network its
# sockets, ktor-client the HTTP tracker/web-seed fetches, kotlinx-io the disk subsystem.
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
ktor-network = { module = "io.ktor:ktor-network", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinxIo" }

[plugins] ########################################################################################
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
vanniktech-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechPublish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
