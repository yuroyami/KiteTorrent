#Gradle
org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.daemon=true

org.gradle.toolchains.jvm.version=21

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx6G

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.incremental.jvm.fir=true

android.uniquePackageNames=false
android.dependency.useConstraints=false

android.newDsl=true
android.builtInKotlin=true

#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.stability.nowarn=true
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.apple.xcodeCompatibility.nowarn=true

#Dokka (v2 generator, aggregated API site at build/dokka/html)
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

#KiteTorrent
group=io.github.yuroyami
version=0.0.1-SNAPSHOT

#Publishing (vanniktech). Shared POM + signing. SNAPSHOT skips signing, so a
#mavenLocal dogfood publish needs no GPG keys. Per-module POM_NAME/POM_DESCRIPTION
#live in each module's gradle.properties. KiteTorrent is BSD-3-Clause (derivative of libtorrent).
SONATYPE_HOST=CENTRAL_PORTAL
RELEASE_SIGNING_ENABLED=false
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/yuroyami/KiteTorrent
POM_LICENCE_NAME=BSD 3-Clause License
POM_LICENCE_URL=https://opensource.org/licenses/BSD-3-Clause
POM_DEVELOPER_ID=yuroyami
POM_DEVELOPER_NAME=yuroyami
POM_DEVELOPER_URL=https://github.com/yuroyami
POM_SCM_URL=https://github.com/yuroyami/KiteTorrent
POM_SCM_CONNECTION=scm:git:git://github.com/yuroyami/KiteTorrent.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/yuroyami/KiteTorrent.git
